name: ee-day

# One Estonian window, fetched and delivered.
#
# WHY THIS IS ONE RUNNER. A country tool whose register refuses part of the cloud address
# space needs several runners drawing several addresses, each shard retrying its own chain,
# and a reconciliation job afterwards merging their indexes. This register refuses none and
# serves each procurement as a single archive it builds itself, so none of that machinery has
# anything to do here: one runner, one pass, and the day's two files written directly.
#
# WHY IT TAKES A RANGE AND NOT A DATE. A night that did not run is a day of procurements
# nobody reads, and the register does not publish them again. One request answers a fortnight
# as easily as a day, so a run that was missed is caught up by widening the window rather than
# by running twice.

on:
  # NO SCHEDULE, DELIBERATELY, and for the same reason in every country tool. The consumer
  # that reads the day is the one that starts it, so there is exactly one actor per day and no
  # second, redundant fetch of the same window. GitHub's cron is a wish that can fire hours
  # late, and nothing that must finish before a fixed hour can be built on it.
  workflow_dispatch:
    inputs:
      date:
        description: "First day of the window, YYYY-MM-DD in Tallinn. Blank means yesterday"
        required: false
        default: ""
      to:
        description: "Last day of the window. Blank means the same as the first — one day"
        required: false
        default: ""
      targets:
        description: "References to re-read whatever the gate says — the cards somebody is still deciding about. One per line; RHR:<ref> or the bare reference"
        required: false
        default: ""
      limit:
        description: "Stop after this many procurements — for a trial run, not for a night"
        required: false
        default: ""

permissions:
  contents: read

# One run per day, because two runs are two draws at a state register and two `day.json`
# files for one date, the second describing less than the first.
concurrency:
  group: ee-day
  cancel-in-progress: false

jobs:
  day:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # The pinned toolchain. LibreOffice reads the Word 97 attachments buyers still send and
    # the open-format spreadsheets this country publishes, p7zip opens the .7z a building
    # project arrives in, and Tesseract with the Estonian pack reads the scans — none of
    # which `apt-get` on the day would install at a fixed version.
    container:
      image: ${{ vars.TOOLCHAIN_IMAGE }}
    steps:
      # Pinned to a full SHA because this repository's Actions policy allows nothing else.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        run: python3 -m unittest discover -s tests -t tests

      # THE WINDOW IS DECIDED ONCE, HERE, AND EVERY LATER STEP READS IT. Computed
      # independently in the fetch step and again in the delivery step, a run that crossed UTC
      # midnight between them would fetch one folder and deliver another — and the second one
      # does not exist.
      #
      # The default is YESTERDAY, not today: the window is by publication date, and a day that
      # has barely started would be delivered near-empty and call itself complete.
      - name: Which window this is
        env:
          RUN_DATE: ${{ inputs.date }}
          RUN_TO: ${{ inputs.to }}
        run: |
          # Computed in UTC on purpose rather than in Europe/Tallinn: the image installs no
          # tzdata, so a named zone would be silently ignored and answer UTC anyway. It is the
          # same answer at the hour this is called — Tallinn runs two or three hours ahead, so
          # its date and UTC's agree for every moment before 21:00 UTC.
          DAY="${RUN_DATE:-$(date -u -d 'yesterday' +%F)}"
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          echo "DAY_TO=${RUN_TO:-$DAY}" >> "$GITHUB_ENV"
          echo "the window is $DAY .. ${RUN_TO:-$DAY}"

      # ASK THE DESTINATION BEFORE WALKING THE REGISTER. The delivery is the last step of the
      # night, so an expired client secret or a moved folder would be discovered after every
      # archive has been downloaded — the most expensive moment to learn something one request
      # answers. A client secret expires on a date nobody has in their calendar, and when it
      # does the night dies whole and silently.
      #
      # With no delivery secrets configured the step does not run at all, and the workflow
      # stays usable by anyone without carrying anybody's addresses.
      - name: Can this run deliver what it is about to fetch
        if: ${{ env.HAVE_GRAPH == 'true' }}
        env:
          HAVE_GRAPH: ${{ secrets.GRAPH_DRIVE_ID != '' }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_DRIVE_ID: ${{ secrets.GRAPH_DRIVE_ID }}
          GRAPH_DEST_ROOT: ${{ secrets.GRAPH_DEST_ROOT }}
          EIS_COUNTRY: EE
        run: python3 deliver_ee.py --check

      # THE GATE IS CHECKED BEFORE THE REGISTER IS TOUCHED, AND THIS IS WHY IT IS A STEP.
      # `policy.load_policy` fails open on purpose — an unreadable policy returns None rather
      # than dropping every procurement, which is the right call inside a library. For an
      # unattended night it is the wrong outcome: no gate means fetching every archive the
      # window holds from a state register, because a secret was misspelt.
      - name: The recall policy, and how much of the window it lets through
        env:
          EE_POLICY: ${{ secrets.EE_POLICY }}
        run: |
          # THE SECRET IS REQUIRED, AND FALLING BACK TO THE COMMITTED FILE WOULD BE WORSE THAN
          # STOPPING. `ee_policy.example.json` is an unrelated illustration — office printing —
          # chosen so the repository discloses nothing about what anybody actually hunts for.
          # A night run against it would fetch almost nothing, deliver a valid day, and report
          # success, which is the one failure shape nobody catches: an empty morning reads
          # exactly like a quiet one.
          if [ -z "$EE_POLICY" ]; then
            echo "::error::no EE_POLICY secret. The committed example is an unrelated illustration and would produce an almost empty night that looks like a successful one."
            exit 1
          fi
          printf '%s' "$EE_POLICY" > policy.json
          echo "policy: from the repository secret"
          python3 -c "
          import json, sys, policy
          rules = policy.load_policy('policy.json')
          if rules is None:
              # WHICH OF THE TWO, because they are different mistakes wearing one symptom.
              # A policy that does not parse arrived broken; one that parses and carries no
              # rule arrived empty, truncated, or renamed around. Both fetch the whole window
              # ungated, and the person fixing it at 04:00 should not have to guess which.
              try:
                  json.load(open('policy.json', encoding='utf-8'))
              except ValueError as bad:
                  sys.exit('the recall policy did not parse (%s) — refusing to fetch the whole window ungated' % bad)
              sys.exit('the recall policy parsed but carries no rule — refusing to fetch the whole window ungated')
          # READ BY POSITION, NEVER UNPACKED. A fixed-width unpack here breaks the night the
          # day the policy grows a field, and this step exists to protect the night.
          names = ('recall term', 'excluded division', 'excluded title term',
                   'override', 'recall code')
          print('policy: ' + ', '.join(
              '%d %s(s)' % (len(v), names[i] if i < len(names) else 'field %d' % (i + 1))
              for i, v in enumerate(rules)))
          "

      - name: Fetch the window
        env:
          EE_POLICY: policy.json
          EIS_COUNTRY: EE
          LIMIT: ${{ inputs.limit }}
          TARGETS: ${{ inputs.targets }}
        run: |
          # The window and the watch list go in ONE pass, deduplicated by the tool. Asking
          # twice would be two draws at one register for one date and two answers about what
          # that date held.
          printf '%s' "$TARGETS" > targets.txt
          echo "fetching the Estonian window $DAY .. $DAY_TO, plus $(grep -c . targets.txt || true) watched reference(s)"
          rc=0
          python3 eis_tool.py day "$DAY" --to "$DAY_TO" --out work \
            ${LIMIT:+--limit $LIMIT} \
            $([ -s targets.txt ] && echo "--targets targets.txt") \
            --policy policy.json || rc=$?

          # A SHORT DAY IS STILL A DAY, AND IT STILL GETS DELIVERED. `day` exits 1 when any
          # target did not arrive — one withdrawn procurement, one reference nobody updated on
          # a card — and under `sh -e` that would skip the delivery below and throw away every
          # procurement that DID arrive. A target that failed is the ordinary case the day's
          # own file exists to describe, and `day.json` records it in `lost` and marks itself
          # incomplete. Only a real error — a bad country, an unparseable argument, an
          # interpreter that died — stops the run.
          if [ "$rc" -eq 1 ]; then
            echo "::warning::the window is short — day.json names what did not arrive, and it is delivered anyway"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      # The fallback lane over the files no decoder could read, and it may never fail the run:
      # a window whose scans stay unread is exactly as complete as it was before this step
      # existed. It reads only the queue the extractor already produced and named, and writes
      # beside that text rather than into it.
      - name: Read what no decoder could
        if: ${{ always() }}
        env:
          EIS_COUNTRY: EE
        run: python3 eis_tool.py scans --out work --date "$DAY_TO" || true

      # The window is on the runner's disk and the runner is about to disappear. Everything
      # after this line is what makes it a day somebody can read tomorrow — and, because the
      # comparison against the drive happens inside it, what makes "what moved" mean anything
      # at all on the second night.
      #
      # Silent about where it writes: every coordinate is a secret and the script prints
      # counts rather than paths.
      - name: Deliver the window where the reader can reach it
        if: ${{ success() && env.HAVE_GRAPH == 'true' }}
        env:
          HAVE_GRAPH: ${{ secrets.GRAPH_DRIVE_ID != '' }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_DRIVE_ID: ${{ secrets.GRAPH_DRIVE_ID }}
          GRAPH_DEST_ROOT: ${{ secrets.GRAPH_DEST_ROOT }}
          EIS_COUNTRY: EE
        run: python3 deliver_ee.py --out work --date "$DAY_TO"
